name: 生成贪吃蛇动图

on:
  schedule:
    # 每天 UTC 0 点自动跑一次（北京时间早上 8 点）
    - cron: "0 0 * * *"
  # 允许在 Actions 页面手动点按钮触发
  workflow_dispatch:
  # 每次推送到 main 也跑一次，方便立刻看到效果
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 生成贪吃蛇 SVG（亮色 + 暗色）
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: 推送到 snake 分支
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
